# D12 · Duplicar, mover o renombrar una lección
#
# Montado desde este guion, con la ⓘ de «Límites de cocientes» y sus tres
# diálogos, tal como salen en la aplicación antes de confirmar.
codigo: D12
titulo: Duplicar, mover o renombrar una lección
subtitulo: Empezar a partir de otra, y reorganizar sin romper nada
ruta: Escribir una lección
siguiente: "E1 · La pantalla de Asignaturas"
voz: narrador
lema: ["Duplicar da dos lecciones;", "darla en otro tema, una en dos sitios."]
lema_en: "darla"

escenas:
  - id: apertura
    antes: 1.2
    despues: 0.6
    frases:
      - id: presentacion
        texto: >-
          Al terminar sabrás empezar una lección a partir de otra, y
          reorganizarlas sin romper nada.

  - id: info
    capitulo: La i
    antes: 0.5
    pantalla: menu
    frases:
      - id: menu
        texto: >-
          Todo está en la i de la lección: duplicar, mover, y darla en otro
          tema.
        pasos:
          - {al: inicio, enfoca: [info, usar], max: 1.7}
          - {en: duplicar, resalta: duplicar, hasta: 1}
          - {en: mover, resalta: mover, hasta: 1}
          - {en: otro tema, resalta: usar}

  - id: duplicar
    capitulo: Duplicar
    antes: 0.5
    pantalla: duplicar
    frases:
      - id: dos
        texto: >-
          Duplicar pide otro título. Desde ese momento son dos lecciones:
          cambiar una no cambia la otra.
        pasos:
          - {al: inicio, enfoca: [dialogo, crear], max: 1.6}
          - {en: título, resalta: titulo, hasta: 1.8}
          - {en: dos lecciones, resalta: donde, etiqueta: "Otra carpeta, otra lección", lado: abajo}

  - id: mover
    capitulo: Mover o renombrar
    antes: 0.5
    pantalla: mover
    frases:
      - id: mover
        texto: >-
          Mover o renombrar la lleva a otro subtema, en las mismas columnas de
          la biblioteca, y deja cambiar el nombre de su carpeta.
        pasos:
          - {al: inicio, enfoca: [sitio, aviso], max: 1.5}
          - {en: subtema, resalta: subtema, hasta: 1.8}
          - {en: carpeta, resalta: carpeta}
      - id: nada
        texto: >-
          Y lo que la usa no hay que tocarlo: los temas la nombran por su id,
          que no cambia al moverla.
        pasos:
          - {en: usa, resalta: aviso, etiqueta: "Nada que reescribir", lado: arriba}

  - id: darla
    capitulo: Darla en otro tema
    antes: 0.5
    pantalla: darla
    frases:
      - id: misma
        texto: >-
          Y darla en otro tema no la copia: es la misma lección, en dos sitios.
          Corregirla una vez la corrige en los dos.
        pasos:
          - {al: inicio, enfoca: [dialogo], max: 1.5}
          - {en: misma, resalta: dialogo}

  - id: cierre
    antes: 0.5
    despues: 2.6
    frases:
      - id: lema
        texto: >-
          Duplicar da dos lecciones; darla en otro tema, una en dos sitios.
        pausa: 0.5
      - id: siguiente
        texto: >-
          En el siguiente vídeo, empiezas a preparar una asignatura: la
          pantalla de Asignaturas.
