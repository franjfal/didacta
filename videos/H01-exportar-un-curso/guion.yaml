# H1 · Exportar un curso para el aula virtual
#
# Montado desde este guion: el curso se exporta de verdad dentro del arnés a
# /Users/Shared/Didacta/Reparto. El aviso de la revisión es real (una
# referencia sin destino puesta por el arnés en «El teorema de Bolzano»), y
# la carpeta del gráfico es la que ha salido.
codigo: H1
titulo: Exportar un curso para el aula virtual
subtitulo: Los PDF de un curso en una carpeta, sin repartir soluciones por error
ruta: Repartir
siguiente: "H2 · Exportar un documento o el PDF que miras"
voz: narrador
lema: ["De salida no sale nada", "que no pueda ver un estudiante."]
lema_en: "que no pueda"

escenas:
  - id: apertura
    antes: 1.2
    despues: 0.6
    frases:
      - id: presentacion
        texto: >-
          Al terminar sabrás sacar los PDF de un curso a una carpeta, sin
          repartir soluciones por error.

  - id: dialogo
    capitulo: Qué se exporta
    antes: 0.5
    pantalla: fila
    frases:
      - id: boton
        texto: >-
          En la fila del curso, Exportar.
        pasos:
          - {al: inicio, enfoca: [fila], max: 1.6, dx: 500}
          - {en: Exportar, resalta: exportar, lado: abajo}
      - id: marcado
        texto: >-
          Pregunta los idiomas y los documentos, todo marcado. Y de salida,
          solo lo que puede ver un estudiante.
        pasos:
          - {al: inicio, cambia: dialogo}
          - {al: inicio, enfoca: [dialogo], max: 1.3, captura: dialogo}
          - {en: idiomas, resalta: es, captura: dialogo, hasta: 1.2}
          - {en: documentos, resalta: tema, captura: dialogo, hasta: 1.8}
          - {en: estudiante, resalta: intro, captura: dialogo}
      - id: profesor
        texto: >-
          Las resoluciones completas, y las copias del profesor, en rojo, hay
          que pedirlas.
        pasos:
          - {en: resoluciones, resalta: soluciones, captura: dialogo, hasta: 1.8}
          - {en: profesor, resalta: profesor, color: rojo, captura: dialogo}

  - id: viejo
    capitulo: Lo que no está al día
    antes: 0.5
    pantalla: dialogo
    frases:
      - id: compilar
        texto: >-
          Si algo no está compilado o se ha quedado viejo, lo dice, y ofrece
          compilar antes solo eso.
        pasos:
          - {al: inicio, enfoca: [viejo, todo], max: 1.7}
          - {en: viejo, resalta: viejo, color: ambar, hasta: 2.4}
          - {en: solo eso, resalta: solo}

  - id: revisar
    capitulo: Revisar antes de repartir
    antes: 0.5
    pantalla: revision
    frases:
      - id: aviso
        texto: >-
          Antes de copiar nada, revisa lo que se va a exportar: aquí, una
          referencia que saldría como dos interrogaciones.
        pasos:
          - {al: inicio, enfoca: [ref], max: 1.8}
          - {en: interrogaciones, resalta: ref, color: ambar, lado: abajo}
      - id: decidir
        texto: >-
          Puedes arreglarlo antes, o exportar igualmente.
        pasos:
          - {al: inicio, enfoca: [cancelar, igualmente], max: 2, dx: -250}
          - {en: arreglarlo, resalta: cancelar, hasta: 1.6}
          - {en: igualmente, resalta: igualmente}

  - id: carpeta
    capitulo: La carpeta
    antes: 0.5
    pantalla: hecho
    frases:
      - id: aviso-2
        texto: >-
          Al acabar, cuántos ficheros ha copiado, y cuántos se ha guardado de
          copiar: los que llevan soluciones o son del profesor.
        pasos:
          - {al: inicio, enfoca: [aviso], max: 2, dy: -120}
          - {en: copiado, resalta: aviso, lado: arriba}
  - id: arbol
    antes: 0.3
    grafico:
      tipo: arbol
      titulo: Nombres que se leen
      x: 300
      lineas:
        - {texto: "Reparto/", en: carpeta}
        - {texto: "Sin tema/", nivel: 1, en: carpeta}
        - {texto: "Tema 1 límites y continuidad - Apuntes.pdf", nivel: 2, en: nombres}
        - {texto: "Tema 1 límites y continuidad - Diapositivas.pdf", nivel: 2, en: nombres}
        - {texto: "Hoja 1 límites y continuidad - Hoja de problemas.pdf", nivel: 2, en: nombres}
        - {texto: "Primer parcial - Examen.pdf", nivel: 2, en: nombres}
    frases:
      - id: nombres
        texto: >-
          En la carpeta, una por tema, y una por idioma si exportas varios. Y
          cada PDF, con un nombre que se lee.

  - id: cierre
    antes: 0.5
    despues: 2.6
    frases:
      - id: lema
        texto: >-
          De salida no sale nada que no pueda ver un estudiante.
        pausa: 0.5
      - id: siguiente
        texto: >-
          En el siguiente vídeo, exportar un documento, o el PDF que estás
          mirando.
