# K2 · Ir más rápido: la paleta y los atajos
#
# Montado desde este guion. La paleta es de verdad dentro del arnés: ⌘K y lo
# que se escribe. Los atajos de ir a una pantalla (⌘1, ⌘2…) los lleva en el
# Mac el menú de la aplicación, que dentro de una prueba no existe: esas
# pantallas se abren por su dirección, y la tecla la dibuja el montaje.
codigo: K2
titulo: "Ir más rápido: la paleta y los atajos"
subtitulo: Ir a cualquier sitio y hacer casi cualquier cosa escribiendo
ruta: A tu manera
siguiente: "K3 · Trabajar con varios repositorios"
voz: narrador
lema: ["Cada orden dice su atajo a la derecha:", "se aprende sin estudiarlo."]
lema_en: "sin estudiarlo"

escenas:
  - id: apertura
    antes: 1.2
    despues: 0.6
    frases:
      - id: presentacion
        texto: >-
          Al terminar sabrás ir a cualquier sitio, y hacer casi cualquier cosa,
          escribiendo.

  - id: paleta
    capitulo: La paleta
    antes: 0.5
    pantalla: vacia
    frases:
      - id: abrir
        texto: >-
          Desde cualquier pantalla, Comando K abre la paleta. Arriba, lo que
          se puede hacer en la pantalla en la que estás.
        pasos:
          - {al: inicio, teclas: "⌘ K"}
          - {al: inicio, enfoca: [campo, segundo], max: 1.8}
          - {en: Arriba, resalta: [primero, segundo], hasta: 2}
          - {en: pantalla, resalta: aqui, lado: izquierda}
      - id: bolzano
        texto: >-
          Escribe bolzano, y están la lección y el problema.
        pasos:
          - {al: inicio, cambia: bolzano}
          - {al: inicio, enfoca: [campo, segundo], max: 1.8, captura: bolzano}
          - {en: bolzano, resalta: campo, captura: bolzano, hasta: 1.2}
          - {en: lección, resalta: primero, captura: bolzano, hasta: 1.4}
          - {en: problema, resalta: segundo, captura: bolzano}
      - id: curso
        texto: >-
          Cálculo 2026, y el curso, con sus documentos.
        pasos:
          - {al: inicio, cambia: curso}
          - {al: inicio, enfoca: [campo, primero], max: 1.8, captura: curso}
          - {en: curso, resalta: primero, captura: curso}
      - id: ajustes
        texto: >-
          Ajustes snippets, y la sección de Ajustes. Intro, y allí.
        pasos:
          - {al: inicio, cambia: ajustes}
          - {al: inicio, enfoca: [campo, primero], max: 1.8, captura: ajustes}
          - {en: sección, resalta: primero, captura: ajustes}
          - {en: Intro, teclas: "↩", captura: ajustes}

  - id: atajos
    capitulo: Los atajos
    antes: 0.5
    pantalla: atajos
    frases:
      - id: derecha
        texto: >-
          Cada orden con atajo lo dice a la derecha: texto más grande, Comando
          más.
        pasos:
          - {al: inicio, enfoca: [campo, atajo], max: 1.8}
          - {en: derecha, resalta: atajo, lado: izquierda, hasta: 1.8}
          - {en: grande, resalta: grande}
      - id: lista
        texto: >-
          Y Comando barra, o Ver los atajos de teclado, los lista todos.
        pasos:
          - {al: inicio, teclas: "⌘ /"}
          - {en: Ver, cambia: orden-atajos}
          - {en: Ver, enfoca: [campo, primero], max: 1.8, captura: orden-atajos}
          - {en: Ver, resalta: primero, captura: orden-atajos}
          - {en: todos, cambia: lista}
          - {en: todos, enfoca: [uno, barra], max: 1.3, captura: lista}
      - id: pantallas
        texto: >-
          Comando uno, Asignaturas; Comando dos, la biblioteca; Comando tres,
          Traducción. Y Comando corchete, atrás y adelante.
        pasos:
          - {al: inicio, resalta: uno, lado: derecha, captura: lista, hasta: 1.5}
          - {en: uno, teclas: "⌘ 1", captura: lista}
          - {en: uno, cambia: asignaturas}
          - {en: uno, enfoca: [rail], max: 2.2, dx: 350, captura: asignaturas}
          - {en: uno, resalta: rail, lado: derecha, captura: asignaturas, hasta: 1.6}
          - {en: dos, teclas: "⌘ 2", captura: asignaturas}
          - {en: dos, cambia: biblioteca}
          - {en: dos, enfoca: [rail], max: 2.2, dx: 350, captura: biblioteca}
          - {en: dos, resalta: rail, lado: derecha, captura: biblioteca, hasta: 1.6}
          - {en: tres, teclas: "⌘ 3", captura: biblioteca}
          - {en: corchete, teclas: "⌘ [", captura: biblioteca}
          - {en: adelante, teclas: "⌘ ]", captura: biblioteca}

  - id: teclado
    capitulo: Sin ratón
    antes: 0.5
    pantalla: teclado
    frases:
      - id: tab
        texto: >-
          Y sin ratón: el tabulador va de botón en botón, marcando dónde está;
          Intro o Espacio lo pulsan.
        pasos:
          - {al: inicio, enfoca: [foco], max: 2.4, dx: -300, dy: 150}
          - {en: tabulador, teclas: "⇥"}
          - {en: marcando, resalta: foco, lado: abajo, alinear: derecha}
          - {en: Intro, teclas: "↩"}
          - {en: Espacio, teclas: "␣"}

  - id: cierre
    antes: 0.5
    despues: 2.6
    frases:
      - id: lema
        texto: >-
          Cada orden dice su atajo a la derecha: se aprende sin estudiarlo.
        pausa: 0.5
      - id: siguiente
        texto: >-
          En el siguiente vídeo, trabajar con varios repositorios a la vez.
