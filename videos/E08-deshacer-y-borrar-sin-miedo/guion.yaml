# E8 · Deshacer y borrar sin miedo
#
# Montado desde este guion: dentro del arnés se quita de verdad el Primer
# parcial del curso, y lo que se ve después --el aviso, Cambios recientes, lo
# que se llevaría quitar la asignatura-- es lo que enseña la aplicación.
codigo: E8
titulo: Deshacer y borrar sin miedo
subtitulo: Deshacer lo que acabas de hacer, y saber qué se lleva un borrado
ruta: Preparar una asignatura
siguiente: "F1 · Compilar una lección o un tema"
voz: narrador
lema: ["Deshacer es un cambio más:", "lo deshecho sigue en el historial."]
lema_en: "lo deshecho"

escenas:
  - id: apertura
    antes: 1.2
    despues: 0.6
    frases:
      - id: presentacion
        texto: >-
          Al terminar sabrás deshacer lo que acabas de hacer, y qué se lleva un
          borrado antes de hacerlo.

  - id: quitar
    capitulo: Quitar un documento
    antes: 0.5
    pantalla: menu
    frases:
      - id: menu
        texto: >-
          En los tres puntos del Primer parcial, Quitar.
        pasos:
          - {al: inicio, enfoca: [fila, quitar], max: 1.5}
          - {en: Quitar, resalta: quitar}
      - id: explica
        texto: >-
          Antes, te dice qué se va: el documento y su lista. Las lecciones no
          se tocan.
        pasos:
          - {al: inicio, cambia: confirmar}
          - {al: inicio, enfoca: [dialogo], max: 1.8, captura: confirmar}
          - {en: lecciones, resalta: dialogo, captura: confirmar}
      - id: guardar
        texto: >-
          Hasta que no guardas, Descartar lo trae de vuelta. Y al guardar, el
          aviso trae Deshacer.
        pasos:
          - {al: inicio, cambia: pendiente}
          - {al: inicio, enfoca: [aviso, guardar], max: 1.5, dy: 200, captura: pendiente}
          - {en: Descartar, resalta: aviso, captura: pendiente, hasta: 2}
          - {en: guardar, cambia: quitado}
          - {en: guardar, reposo: true, captura: quitado}
          - {en: Deshacer, resalta: deshacer, etiqueta: "Deshacer", lado: arriba, captura: quitado}

  - id: recientes
    capitulo: Cambios recientes
    antes: 0.5
    pantalla: reloj
    frases:
      - id: reloj
        texto: >-
          Si ha pasado un rato, el reloj de Asignaturas abre los cambios
          recientes, cada uno con su Deshacer.
        pasos:
          - {al: inicio, enfoca: [reloj], max: 1.8, dy: 200}
          - {en: reloj, resalta: reloj}
          - {en: recientes, cambia: recientes}
          - {en: recientes, enfoca: [dialogo], max: 1.3, captura: recientes}
          - {en: Deshacer, resalta: fila, captura: recientes}
      - id: niega
        texto: >-
          Y se niega si alguien lo ha tocado después: no deshace el trabajo de
          otro.

  - id: asignatura
    capitulo: Quitar una asignatura
    antes: 0.5
    pantalla: asignatura
    frases:
      - id: cuenta
        texto: >-
          Quitar una asignatura dice lo que se lleva, contado, y lo que no: las
          lecciones, que siguen en la biblioteca.
        pasos:
          - {al: inicio, enfoca: [dialogo], max: 1.8}
          - {en: contado, resalta: cuenta, hasta: 2.4}
          - {en: lecciones, resalta: unidades}
      - id: historia
        texto: >-
          Y nada se pierde: deshacer es un cambio más, y lo que había sigue en
          la historia del repositorio.
        pasos:
          - {en: historia, resalta: nota}

  - id: cierre
    antes: 0.5
    despues: 2.6
    frases:
      - id: lema
        texto: >-
          Deshacer es un cambio más: lo deshecho sigue en el historial.
        pausa: 0.5
      - id: siguiente
        texto: En el siguiente vídeo, compilar una lección o un tema.
