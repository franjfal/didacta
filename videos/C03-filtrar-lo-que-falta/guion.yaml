# C3 · Filtrar lo que falta, por tipo o por bloque
#
# Montado desde este guion, con capturas del repositorio de ejemplo mirado en
# inglés (`"idioma": "en"` en capturas.json): el plan decía valenciano, y los
# vídeos enseñan el inglés como segundo idioma.
codigo: C3
titulo: Filtrar lo que falta, por tipo o por bloque
subtitulo: Quedarte con lo que te interesa, y saber cuánto queda
ruta: Encontrar material
siguiente: "C4 · Organizar la biblioteca"
voz: narrador
lema: ["Los filtros recortan también el árbol,", "no solo la búsqueda."]
lema_en: "no solo"

escenas:
  - id: apertura
    antes: 1.2
    despues: 0.6
    frases:
      - id: presentacion
        texto: >-
          Al terminar sabrás quedarte solo con lo que te interesa, y cuánto te
          queda por hacer.

  - id: falta
    capitulo: Lo que falta
    antes: 0.5
    pantalla: todo
    frases:
      - id: elegir
        texto: >-
          Mirando en inglés, abre Traducción, y elige «Falta en este idioma».
        pasos:
          - {al: inicio, reposo: true}
          - {en: inglés, resalta: idioma, etiqueta: "Mirando en inglés", lado: abajo, alinear: derecha, hasta: 1.8}
          - {en: Traducción, pulsa: traduccion}
          - {en: Traducción, cambia: menu}
          - {en: Traducción, enfoca: [menu], max: 1.8, captura: menu, dy: 60}
          - {en: Falta, resalta: falta, captura: menu}
      - id: recorta
        texto: >-
          El árbol y sus números se recortan a lo que falta, y la cabecera dice
          cuántas quedan: siete de nueve.
        pasos:
          - {al: inicio, cambia: falta}
          - {al: inicio, reposo: true, captura: falta}
          - {en: árbol, resalta: [limites, continuidad], captura: falta, hasta: 2.4}
          - {en: cabecera, resalta: cabecera, etiqueta: "Cuántas quedan", lado: derecha, captura: falta}
      - id: quitar
        texto: >-
          Cada filtro puesto sale aquí, y la cruz lo quita.
        pasos:
          - {en: aquí, resalta: chip, etiqueta: "La cruz lo quita", lado: derecha, captura: falta}

  - id: tipo
    capitulo: Por tipo, por bloque
    antes: 0.5
    pantalla: tipo
    frases:
      - id: tipos
        texto: >-
          También te puedes quedar con un tipo: solo los ejemplos, o solo los
          problemas.
        pasos:
          - {al: inicio, enfoca: [tipo, menu], max: 1.7, dy: 60}
          - {en: tipo, resalta: menu}
      - id: bloque
        texto: >-
          O con un bloque, como la teoría o los problemas.
        pasos:
          - {al: inicio, cambia: bloque}
          - {al: inicio, reposo: true, captura: bloque}
          - {en: bloque, resalta: bloques, etiqueta: "Por bloque", captura: bloque}
      - id: repositorio
        texto: >-
          Y si tienes varios repositorios abiertos, también por repositorio.
        pasos:
          - {en: repositorio, rotulo: "Y por repositorio, si hay varios"}

  - id: orden
    capitulo: Ordenar
    antes: 0.5
    pantalla: orden
    frases:
      - id: orden
        texto: >-
          En Orden, lo que está por traducir sale primero: así se ve por dónde
          empezar.
        pasos:
          - {al: inicio, enfoca: [orden, menu], max: 1.8, dy: 60}
          - {en: por traducir, resalta: pendiente, etiqueta: "Por traducir primero", lado: derecha}

  - id: guardar
    capitulo: Guardar una búsqueda
    antes: 0.5
    pantalla: guardar
    frases:
      - id: guardar
        texto: >-
          Y con la interfaz completa, lo que estás mirando, con sus filtros, se
          guarda con un nombre, y vuelve de un clic.
        pasos:
          - {al: inicio, enfoca: [resumen, guardar], max: 1.5, dy: 120}
          - {en: guarda, resalta: guardar, etiqueta: "Guardar esta búsqueda", lado: abajo, alinear: derecha}

  - id: cierre
    antes: 0.5
    despues: 2.6
    frases:
      - id: lema
        texto: >-
          Los filtros recortan también el árbol, no solo la búsqueda.
        pausa: 0.5
      - id: siguiente
        texto: En el siguiente vídeo, organizar la biblioteca.
