# D11 · Crear una lección nueva
#
# Montado desde este guion: la lección se crea de verdad dentro del arnés,
# desde la biblioteca, y se abre en el editor como la abriría cualquiera.
codigo: D11
titulo: Crear una lección nueva
subtitulo: En el tema que le toca, y en su carpeta
ruta: Escribir una lección
siguiente: "D12 · Duplicar, mover o renombrar una lección"
voz: narrador
lema: ["Cada lección nace en su sitio:", "categoría, tema y subtema."]
lema_en: "en su sitio"

escenas:
  - id: apertura
    antes: 1.2
    despues: 0.6
    frases:
      - id: presentacion
        texto: >-
          Al terminar sabrás crear una lección nueva, en el sitio que le toca.

  - id: nueva
    capitulo: Nueva lección
    antes: 0.5
    pantalla: tema
    frases:
      - id: boton
        texto: >-
          En la biblioteca, dentro del subtema Funciones continuas, pulsa
          «Nueva lección en Funciones continuas».
        pasos:
          - {al: inicio, reposo: true}
          - {en: subtema, resalta: continuidad, hasta: 1.6}
          - {en: pulsa, resalta: nueva, hasta: 1.4}
          - {en: pulsa, pulsa: nueva}
      - id: campos
        texto: >-
          Pide el título, el sitio, en las mismas columnas de la biblioteca y
          abiertas donde estabas, y el tipo.
        pasos:
          - {al: inicio, cambia: dialogo}
          - {al: inicio, enfoca: [titulo, donde], max: 1.5, captura: dialogo}
          - {en: título, resalta: titulo, captura: dialogo, hasta: 1.2}
          - {en: sitio, resalta: sitio, captura: dialogo, hasta: 1.4}
          - {en: abiertas, resalta: subtema, captura: dialogo, hasta: 1.4}
          - {en: tipo, resalta: tipo, captura: dialogo}
      - id: falta
        texto: >-
          Y si el subtema que buscas no existe, se crea aquí mismo, al pie de
          su columna.
        pasos:
          - {en: crea, resalta: nuevo_subtema, etiqueta: "Nuevo subtema", lado: abajo, captura: dialogo}

  - id: donde
    capitulo: Dónde va a quedar
    antes: 0.5
    pantalla: dialogo
    frases:
      - id: carpeta
        texto: >-
          Antes de crearla, dice dónde va a quedar: la carpeta sigue al sitio
          de la biblioteca, categoría, tema y subtema.
        pasos:
          - {al: inicio, enfoca: [titulo, donde], max: 1.8}
          - {en: dónde, resalta: donde, etiqueta: "Su carpeta", lado: abajo}
      - id: tipo
        texto: >-
          Y el tipo decide si va con la teoría o con los problemas.
        pasos:
          - {en: tipo, cambia: problema}
          - {en: tipo, resalta: [tipo, donde], captura: problema}

  - id: creada
    capitulo: Se abre
    antes: 0.5
    pantalla: creada
    frases:
      - id: abre
        texto: >-
          Al crearla, se abre en el editor, en el idioma de referencia, con un
          esqueleto para empezar a escribir.
        pasos:
          - {al: inicio, reposo: true}
          - {en: idioma, resalta: es, etiqueta: "En el idioma de referencia", lado: abajo}

  - id: otra
    capitulo: La otra puerta
    antes: 0.5
    pantalla: otra
    frases:
      - id: tema
        texto: >-
          La otra puerta está al añadir lecciones a un tema: Crear una nueva,
          que la deja ya puesta en él.
        pasos:
          - {al: inicio, reposo: true}
          - {en: Crear una nueva, resalta: crear, etiqueta: "Crear una nueva", lado: arriba}

  - id: cierre
    antes: 0.5
    despues: 2.6
    frases:
      - id: lema
        texto: >-
          Cada lección nace en su sitio: categoría, tema y subtema.
        pausa: 0.5
      - id: siguiente
        texto: >-
          En el siguiente vídeo, duplicar, mover o renombrar una lección.
