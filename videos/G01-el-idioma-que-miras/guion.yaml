# G1 · El idioma que miras, y con cuáles trabajas
#
# Montado desde este guion, con la biblioteca del repositorio de ejemplo
# mirada en castellano y en inglés, y el valenciano quitado de «con los que
# trabajas» dentro del arnés.
codigo: G1
titulo: El idioma que miras, y con cuáles trabajas
subtitulo: Cambiar el idioma en que ves el material, y quitarte los que no usas
ruta: Traducir
siguiente: "G2 · La cola de traducción"
voz: narrador
lema: ["Con qué idiomas trabajas es cosa tuya:", "no cambia ningún fichero."]
lema_en: "no cambia"

escenas:
  - id: apertura
    antes: 1.2
    despues: 0.6
    frases:
      - id: presentacion
        texto: >-
          Al terminar sabrás cambiar el idioma en que ves el material, y
          quitarte de delante los que no usas.

  - id: idioma
    capitulo: El idioma que miras
    antes: 0.5
    pantalla: castellano
    frases:
      - id: arriba
        texto: >-
          Arriba, el idioma en que miras el material. Manda en toda la
          aplicación.
        pasos:
          - {al: inicio, enfoca: [idioma], max: 2, dx: -300, dy: 120}
          - {en: idioma, resalta: idioma, lado: abajo, alinear: derecha}
          - {en: Manda, cambia: menu}
          - {en: Manda, resalta: en, captura: menu}
      - id: titulos
        texto: >-
          En inglés, los títulos salen en inglés, y cada fila dice cómo está
          su versión inglesa.
        pasos:
          - {al: inicio, cambia: ingles}
          - {al: inicio, reposo: true, captura: ingles}
          - {en: títulos, resalta: tarjeta, captura: ingles, hasta: 2.2}
          - {en: versión, resalta: estados, etiqueta: "Su versión inglesa", captura: ingles}

  - id: trabajas
    capitulo: Con cuáles trabajas
    antes: 0.5
    pantalla: trabajas
    frases:
      - id: ajustes
        texto: >-
          En Ajustes, Idiomas, eliges con cuáles trabajas. Si no das clase en
          valenciano, lo quitas.
        pasos:
          - {al: inicio, enfoca: [titulo, en], max: 1.6, dy: 60}
          - {en: trabajas, resalta: [es, va, en], hasta: 2.4}
          - {en: quitas, resalta: quitar}
      - id: fichero
        texto: >-
          Es solo para ti: deja de ofrecértelo, y no cambia ningún fichero.
        pasos:
          - {al: inicio, cambia: confirmar}
          - {al: inicio, enfoca: [dialogo], max: 1.6, captura: confirmar}
          - {en: ningún fichero, resalta: explica, captura: confirmar}

  - id: sigue
    capitulo: Lo que ya lo usa
    antes: 0.5
    pantalla: sinva
    frases:
      - id: arriba-2
        texto: >-
          Arriba ya no se ofrece. Pero sigue saliendo donde algo ya lo usa: el
          estado de cada lección en valenciano.
        pasos:
          - {al: inicio, enfoca: [selector, tarjeta], max: 1.3}
          - {en: ofrece, resalta: selector, etiqueta: "Castellano e inglés", lado: abajo, alinear: derecha, hasta: 2.6}
          - {en: estado, resalta: va, lado: abajo}

  - id: cierre
    antes: 0.5
    despues: 2.6
    frases:
      - id: lema
        texto: >-
          Con qué idiomas trabajas es cosa tuya: no cambia ningún fichero.
        pausa: 0.5
      - id: siguiente
        texto: En el siguiente vídeo, la cola de traducción.
