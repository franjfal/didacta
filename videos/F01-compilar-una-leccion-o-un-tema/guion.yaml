# F1 · Compilar una lección o un tema
#
# Montado desde este guion, con compilaciones de verdad dentro del arnés: la
# del Tema 1 entero y, justo después, la misma sin cambios, que tarda menos de
# un segundo.
codigo: F1
titulo: Compilar una lección o un tema
subtitulo: Elegir versiones e idiomas, y no esperar dos veces por lo mismo
ruta: Compilar y revisar
siguiente: "F2 · Leer los PDF dentro de Didacta"
voz: narrador
lema: ["Lo que no ha cambiado", "no se vuelve a compilar."]
lema_en: "no se vuelve"

escenas:
  - id: apertura
    antes: 1.2
    despues: 0.6
    frases:
      - id: presentacion
        texto: >-
          Al terminar sabrás compilar una lección o un tema entero, en el
          idioma que quieras.

  - id: leccion
    capitulo: Una lección
    antes: 0.5
    pantalla: leccion
    frases:
      - id: vista
        texto: >-
          En una lección, la pestaña Compilar deja elegir versiones e idiomas,
          y la compila sola, para verla.
        pasos:
          - {al: inicio, enfoca: [panel], max: 1.4, dy: -120}
          - {en: versiones, resalta: panel, hasta: 3}
          - {en: sola, resalta: compilar}

  - id: tema
    capitulo: Un tema
    antes: 0.5
    pantalla: curso
    frases:
      - id: boton
        texto: >-
          En el curso, el botón de cada documento compila sus versiones.
        pasos:
          - {al: inicio, enfoca: [fila, boton], max: 1.6}
          - {en: botón, resalta: boton}
      - id: mantener
        texto: >-
          Manteniéndolo pulsado, eliges: en este idioma, en todos a la vez, o
          todas las versiones.
        pasos:
          - {al: inicio, cambia: menu}
          - {al: inicio, enfoca: [aqui, versiones], max: 1.8, captura: menu}
          - {en: este idioma, resalta: aqui, captura: menu, hasta: 1.4}
          - {en: todos, resalta: todos, captura: menu, hasta: 1.4}
          - {en: versiones, resalta: versiones, captura: menu}

  - id: compila
    capitulo: Mientras compila
    antes: 0.5
    pantalla: compilando
    frases:
      - id: consola
        texto: >-
          Las versiones se compilan a la vez, y la consola dice por cuál va.
        pasos:
          - {al: inicio, enfoca: [cabecera, paso], max: 1.3, dy: -60}
          - {en: a la vez, resalta: cabecera, hasta: 2}
          - {en: por cuál, resalta: paso, etiqueta: "Por cuál va", lado: abajo}
      - id: listo
        texto: >-
          Al terminar, lo que ha ido bien, y lo que hay que mirar.
        pasos:
          - {al: inicio, cambia: hecho}
          - {al: inicio, enfoca: [cabecera, avisos], max: 1.5, captura: hecho}
          - {en: bien, resalta: tiempo, captura: hecho, hasta: 1.6}
          - {en: mirar, resalta: avisos, color: ambar, captura: hecho}

  - id: otra
    capitulo: Otra vez
    antes: 0.5
    pantalla: otra
    frases:
      - id: rapido
        texto: >-
          Y si lo compilas otra vez sin cambiar nada, es casi inmediato: lo que
          no ha cambiado no se vuelve a compilar.
        pasos:
          - {al: inicio, enfoca: [cabecera], max: 1.8}
          - {en: inmediato, resalta: tiempo, etiqueta: "Menos de un segundo", lado: abajo}

  - id: cierre
    antes: 0.5
    despues: 2.6
    frases:
      - id: lema
        texto: >-
          Lo que no ha cambiado no se vuelve a compilar.
        pausa: 0.5
      - id: siguiente
        texto: En el siguiente vídeo, leer los PDF dentro de Didacta.
