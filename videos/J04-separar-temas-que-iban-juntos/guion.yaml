# J4 · Separar temas que iban juntos
#
# Montado desde este guion. Todo es de verdad dentro del arnés: el arnés pone
# Matemáticas I (del Grado en Física) en el mismo repositorio, y dentro se le
# da vinculado el Tema 1 de Cálculo I y se crea 2027-2028, que se lo lleva
# también: tres ubicaciones. «Crear copia independiente» se abre y se
# cancela; la división en grupos se hace de verdad, con la interfaz Completa.
codigo: J4
titulo: Separar temas que iban juntos
subtitulo: Cuando dos asignaturas dejan de dar el tema igual
ruta: El curso que viene y el temario compartido
siguiente: "K1 · Claro u oscuro, tamaño del texto e idioma de Didacta"
voz: narrador
lema: ["Dentro de cada grupo siguen juntos;", "entre grupos, cada uno por su lado."]
lema_en: "cada uno por su lado"

escenas:
  - id: apertura
    antes: 1.2
    despues: 0.6
    frases:
      - id: presentacion
        texto: >-
          Al terminar sabrás separar un tema vinculado cuando las asignaturas
          dejan de darlo igual.

  - id: suelta
    capitulo: Una ubicación
    antes: 0.5
    pantalla: menu
    frases:
      - id: tres
        texto: >-
          Este Tema 1 se da en tres sitios: los dos cursos de Cálculo I, y
          Matemáticas I, en Física.
        pasos:
          - {al: inicio, enfoca: [ubicaciones, copia], max: 1.8, dx: -300}
          - {en: tres, resalta: ubicaciones, lado: izquierda}
      - id: copia
        texto: >-
          Si solo este tiene que ir por su lado, Crear copia independiente.
        pasos:
          - {en: Crear, resalta: copia, lado: izquierda}
      - id: dialogo
        texto: >-
          Esta ubicación se queda con una copia del tema tal como está, y los
          demás siguen igual, juntos.
        pasos:
          - {al: inicio, cambia: separar}
          - {al: inicio, enfoca: [titulo, confirmar], max: 1.7, captura: separar}
          - {en: copia, resalta: nota, lado: abajo, captura: separar}

  - id: grupos
    capitulo: Repartir en grupos
    antes: 0.5
    pantalla: menu-completa
    frases:
      - id: completa
        texto: >-
          Para repartir varias a la vez, con la interfaz Completa, Gestionar
          vinculación.
        pasos:
          - {al: inicio, enfoca: [gestionar, copia], max: 1.8, dx: -300}
          - {en: Gestionar, resalta: gestionar, lado: izquierda}
      - id: reparte
        texto: >-
          Cada ubicación, a su grupo: los dos cursos de Cálculo I en el A, y
          Matemáticas I en el B.
        pasos:
          - {al: inicio, cambia: grupos}
          - {al: inicio, enfoca: [explica, fisica], max: 1.6, captura: grupos}
          - {en: Cálculo, resalta: [calculo, calculo2], captura: grupos, hasta: 2}
          - {en: Matemáticas, resalta: b, lado: abajo, captura: grupos}
      - id: resumen
        texto: >-
          Antes de confirmar, dice qué va a quedar: el A se queda con el tema,
          y el B, con una copia.
        pasos:
          - {al: inicio, enfoca: [grupoa, profundo], max: 1.7, captura: grupos}
          - {en: A, resalta: grupoa, lado: abajo, captura: grupos, hasta: 1.8}
          - {en: B, resalta: grupob, lado: abajo, captura: grupos}
      - id: lecciones
        texto: >-
          Y Duplicar también las lecciones viene apagado a propósito: separar
          dos temas casi nunca es separar sus lecciones. Así, una errata se
          sigue corrigiendo una vez.
        pasos:
          - {en: Duplicar, resalta: profundo, lado: abajo, captura: grupos}
      - id: dividir
        texto: >-
          Con Dividir, Matemáticas I tiene su propio tema, sin eslabón. Y Cálculo
          I sigue con el suyo, compartido entre sus dos cursos.
        pasos:
          - {al: inicio, enfoca: [dividir], max: 1.6, captura: grupos}
          - {al: inicio, pulsa: dividir, captura: grupos}
          - {en: Matemáticas, cambia: dividido}
          - {en: Matemáticas, enfoca: [titulo], max: 2.2, dx: 150, captura: dividido}
          - {en: eslabón, resalta: titulo, lado: abajo, captura: dividido, hasta: 1.5}
          - {en: Cálculo, cambia: calculo}
          - {en: Cálculo, enfoca: [titulo, eslabon], max: 2.2, dx: 150, captura: calculo}
          - {en: compartido, resalta: eslabon, lado: abajo, captura: calculo}

  - id: entera
    antes: 0.4
    grafico:
      tipo: frase
      uno: "Dividir se hace entera,"
      dos: "o no se hace."
      dos_en: no se hace
    frases:
      - id: entera
        texto: >-
          Y se hace entera o no se hace: todo en un solo cambio, sin
          ubicaciones a medias.

  - id: cierre
    antes: 0.5
    despues: 2.6
    frases:
      - id: lema
        texto: >-
          Dentro de cada grupo siguen juntos; entre grupos, cada uno por su
          lado.
        pausa: 0.5
      - id: siguiente
        texto: >-
          En el siguiente vídeo, claro u oscuro, el tamaño del texto, y el
          idioma de Didacta.
