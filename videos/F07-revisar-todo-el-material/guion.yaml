# F7 · Revisar todo el material de una vez
#
# Montado desde este guion. Lo que encuentra es de verdad: el arnés pone en
# el repositorio de ejemplo una figura que no está, un \lgem en castellano y
# una referencia sin destino, y la nota histórica ya está sin usar.
codigo: F7
titulo: Revisar todo el material de una vez
subtitulo: Encontrar lo que está mal antes de que salga en clase
ruta: Compilar y revisar
siguiente: "F8 · Apuntes accesibles"
voz: narrador
lema: ["Busca lo que compila, o casi,", "y está mal."]
lema_en: "y está mal"

escenas:
  - id: apertura
    antes: 1.2
    despues: 0.6
    frases:
      - id: presentacion
        texto: >-
          Al terminar sabrás encontrar lo que está mal en tu material antes de
          que lo encuentre un alumno.

  - id: revisar
    capitulo: Revisar
    antes: 0.5
    pantalla: biblioteca
    frases:
      - id: boton
        texto: >-
          En la biblioteca, arriba a la derecha, Revisar.
        pasos:
          - {al: inicio, enfoca: [revisar], max: 2, dy: 140}
          - {en: Revisar, resalta: revisar, lado: abajo}

  - id: siempre
    capitulo: Lo que mira siempre
    antes: 0.5
    pantalla: informe
    frases:
      - id: lista
        texto: >-
          Mira siempre lo mismo: figuras que faltan, órdenes de otro idioma,
          referencias que saldrían como dos interrogaciones.
        pasos:
          - {al: inicio, enfoca: [dialogo], max: 1.3}
          - {en: figuras, resalta: figura, hasta: 1.8}
          - {en: idioma, resalta: babel, hasta: 1.8}
          - {en: referencias, resalta: ref, color: ambar}
      - id: tambien
        texto: >-
          Y también las diapositivas que se salen, los entornos que no define
          nadie, y las traducciones desactualizadas.
      - id: abrir
        texto: >-
          Cada cosa con su lección, su idioma y su línea, y Abrir te lleva
          allí.
        pasos:
          - {en: Abrir, resalta: abrir, lado: izquierda}

  - id: extras
    capitulo: Lo que se pide
    antes: 0.5
    pantalla: extras
    frases:
      - id: pedir
        texto: >-
          Arriba se piden más: fórmulas distintas entre idiomas, lecciones sin
          usar, coma y punto mezclados, u ortografía.
        pasos:
          - {al: inicio, enfoca: [extras], max: 1.6, dy: 60}
          - {en: fórmulas, resalta: formulas, hasta: 1.8}
          - {en: sin usar, resalta: unused, hasta: 1.8}
          - {en: ortografía, resalta: ortografia}
      - id: sinusar
        texto: >-
          Con lecciones sin usar, sale la nota histórica: ningún documento la
          da.
        pasos:
          - {al: inicio, enfoca: [dialogo], max: 1.3}
          - {en: nota, resalta: sinusar, etiqueta: "Ningún documento la da", lado: abajo}
      - id: diccionario
        texto: >-
          La ortografía pide el diccionario instalado, y la palabra buena que
          no conoce se apunta una vez, y deja de salir.

  - id: cierre
    antes: 0.5
    despues: 2.6
    frases:
      - id: lema
        texto: >-
          Busca lo que compila, o casi, y está mal.
        pausa: 0.5
      - id: siguiente
        texto: En el siguiente vídeo, apuntes accesibles.
