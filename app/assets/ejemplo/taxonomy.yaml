# La clasificación de la biblioteca.
#
# Cada lección dice en su `unit.yaml` de qué categoría y de qué tema es, por
# id (`category: calculo`, `topic: limites`). Aquí se declara el nombre que se
# lee de cada id, en cada idioma.
#
# Separar el id del nombre es lo que permite renombrar: cambiar «Límites» por
# «Límites de funciones» es cambiar una línea de este fichero, sin mover
# ninguna carpeta ni tocar ninguna lección. El id, en cambio, no se toca: si
# hace falta otro, es otro tema.
#
# Este fichero es opcional. Sin él, la biblioteca enseña los ids tal cual.

categories:
  - id: calculo
    title:
      es: Cálculo
      va: Càlcul
      en: Calculus
    topics:
      - id: limites
        title:
          es: Límites
          va: Límits
          en: Limits
        subtopics:
          - id: concepto-de-limite
            title:
              es: El concepto de límite
              va: El concepte de límit
              en: The idea of a limit
          - id: calculo-de-limites
            title:
              es: Cálculo de límites
              va: Càlcul de límits
              en: Computing limits
      - id: continuidad
        title:
          es: Continuidad
          va: Continuïtat
          en: Continuity
        subtopics:
          - id: funciones-continuas
            title:
              es: Funciones continuas
              va: Funcions contínues
              en: Continuous functions
          - id: bolzano
            title:
              es: El teorema de Bolzano
              va: El teorema de Bolzano
              en: "Bolzano's theorem"
