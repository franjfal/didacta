# Publicar una versión de Didacta.
#
# Se lanza a mano desde Actions → «Publish Didacta Release» → Run workflow, y
# no hay nada que rellenar: **el número lo pone el ciclo**. Cada publicación
# sube la mediana --1.1.0 → 1.2.0-- y el build de uno en uno. El procedimiento
# entero es escribir la sección del CHANGELOG y pulsar el botón.
#
#     python3 packaging/release.py next     # el número que va a salir
#
# El número **no se escribe a mano** en `app/pubspec.yaml`. Esa línea es el
# registro de lo último que se publicó, y quien la sube es este workflow al
# publicar. Subirla a mano se salta un número, porque el ciclo la subirá igual
# la próxima vez.
#
# Cómo se reparte ese número sin pasarse un commit entre trabajos: cada
# trabajo ejecuta `release.py bump` sobre su propia copia nada más
# descargarla. La función es determinista, así que los cuatro llegan al mismo
# número, y los binarios llevan dentro el que se publica. El commit con la
# versión nueva se hace **al final**, en `publicar`, cuando el release ya
# existe: si algo se rompe antes, el número no se ha gastado.
#
# El orden de los trabajos no es casual:
#
#   1. `comprobar` sube el número, mira las notas y que el tag no exista
#      **antes** de compilar nada. Descubrir que falta la sección del
#      CHANGELOG después de tres compilaciones de quince minutos es tirar
#      media hora por algo que se ve en un segundo;
#   2. `pruebas` corre los tests de los dos lados. Publicar algo que no pasa
#      sus propios tests no es publicar, es repartir un problema;
#   3. `construir` compila los tres sistemas **en paralelo y sin fail-fast**,
#      para que un fallo en Windows no esconda si Linux estaba bien;
#   4. `publicar` solo se ejecuta si los tres salieron. Si falta uno, no hay
#      release: media versión publicada es peor que ninguna.
#
# Y dentro de `publicar`, el release se crea **en borrador**, se suben los
# binarios, se genera el manifiesto con los identificadores que GitHub acaba
# de asignar, y solo entonces se publica. Si algo se rompe a la mitad, lo que
# queda es un borrador, que ni `releases/latest` devuelve ni la aplicación
# mira.
# La versión de Flutter está fijada en `.fvmrc`, no es «la última estable».
#
# Para una tubería que publica binarios, «stable» es un objetivo que se mueve:
# el runner se trajo una 3.47 el día que aquí había una 3.44, y lo primero que
# se notó fue que el formateador había cambiado de opinión sobre tres ficheros.
# Lo que no se habría notado igual de pronto es que el binario que se reparte
# viniera de un compilador que nadie eligió.
#
# Subirla es cambiar ese fichero, y entonces el cambio se ve en un diff y se
# prueba antes de publicar con él.
name: Publish Didacta Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ensayo: compila y comprueba todo, pero no publica nada'
        type: boolean
        default: false

# Lo mínimo, y se sube a `write` solo en el trabajo que publica.
#
# Antes esto era más complicado: las versiones vivían en un repositorio
# privado aparte y escribir allí necesitaba el token de una GitHub App
# instalada solo en él. Al abrir el código, ese repositorio dejó de tener
# sentido --separaba el código de los binarios para no dar el primero a quien
# recibía los segundos-- y con él se fue la GitHub App, sus dos secrets y la
# mitad de las cosas que podían caducar sin avisar.
permissions:
  contents: read

env:
  # Aquí mismo. `github.repository` y no el nombre escrito: así un fork que
  # lance este workflow publica en su propio repositorio y no intenta escribir
  # en éste.
  RELEASE_REPO: ${{ github.repository }}

# Una publicación a la vez. Dos a la vez sobre el mismo tag es cómo se acaba
# con un release a medias y otro encima.
concurrency:
  group: didacta-release
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  comprobar:
    name: la versión y las notas
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.leer.outputs.version }}
      build: ${{ steps.leer.outputs.build }}
      tag: ${{ steps.leer.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: el número de esta versión
        # Sobre esta copia y sin commit: aquí sólo se calcula y se comprueba.
        # Quien lo escribe en el repositorio es `publicar`, y sólo cuando el
        # release ya está hecho.
        run: python3 packaging/release.py bump

      - name: la versión, el build y las notas
        id: leer
        run: python3 packaging/release.py check

      - name: y que se lean igual desde la aplicación
        # El mismo número, leído por el otro lado. Si `pubspec.yaml` dijera
        # una cosa y la aplicación otra, el actualizador compararía contra
        # algo que no es lo instalado. Esto comprueba además que la reescritura
        # de `bump` deja la línea donde el resto espera encontrarla.
        run: |
          grep -q "^version: ${{ steps.leer.outputs.version }}+" app/pubspec.yaml

      # En un ensayo no importa que el tag exista: se salta, y así el ensayo
      # sirve para comprobar que los tres sistemas compilan sin mirar nada más.
      - name: que esa versión no esté publicada ya
        if: ${{ !inputs.dry_run }}
        # Republicar un tag es la forma más rápida de que alguien acabe con
        # una 1.4.2 distinta de la 1.4.2 de al lado. Se comprueba antes de
        # compilar; si ya existe, hay que subir la versión.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.leer.outputs.tag }}" \
               -R "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "::error::La versión ${{ steps.leer.outputs.version }} ya está publicada en $RELEASE_REPO. Sube el número en app/pubspec.yaml."
            exit 1
          fi
          echo "· ${{ steps.leer.outputs.tag }} está libre."

  # -------------------------------------------------------------------------
  pruebas:
    name: los tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: el motor
        run: python3 -m unittest discover -s tests -v

      - name: la herramienta de publicación
        run: python3 -m unittest discover -s packaging -p 'test_*.py' -v

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: las dependencias
        working-directory: app
        run: flutter pub get

      - name: el analizador, sin excepciones
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: el formato
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: los tests de la aplicación
        working-directory: app
        run: flutter test

  # -------------------------------------------------------------------------
  construir:
    name: ${{ matrix.nombre }}
    needs: [comprobar, pruebas]
    # Sin fail-fast a propósito: si Windows falla, hay que poder ver si Linux
    # y macOS estaban bien. Cancelar los otros dos esconde justo eso.
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: macOS (universal)
            os: macos-latest
          - nombre: Windows (x64)
            os: windows-latest
          - nombre: Linux (x64)
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    # Al nivel del trabajo y no de cada paso: un `env` declarado en el propio
    # paso no está disponible en su `if`, y el resultado sería un paso de
    # firma que se ejecuta siempre y falla cuando no hay certificado.
    # Vacíos cuando el secreto no existe, que es la condición que se mira.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v7

      - name: el número de esta versión
        # Antes de compilar nada: es lo que hace que el binario diga de sí
        # mismo el número con el que se publica. Sin esto, la aplicación
        # instalada se llamaría como la versión anterior y no se ofrecería
        # actualizar nunca.
        #
        # `shell: bash` para que la misma línea valga también en Windows.
        shell: bash
        run: python3 packaging/release.py bump

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: las dependencias
        working-directory: app
        run: flutter pub get

      # --------------------------------------------------------- macOS ----
      - name: el certificado de macOS
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # Un llavero temporal y solo para este trabajo: importar en el
          # llavero de sesión del runner dejaría la clave privada donde otro
          # paso podría leerla.
          keychain=$RUNNER_TEMP/didacta.keychain-db
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: compilar para macOS
        if: runner.os == 'macOS'
        working-directory: app
        run: flutter build macos --release

      - name: firmar
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          chmod +x packaging/macos/*.sh
          packaging/macos/sign.sh \
            app/build/macos/Build/Products/Release/Didacta.app

      - name: empaquetar (DMG + ZIP)
        if: runner.os == 'macOS'
        run: |
          packaging/macos/package.sh \
            app/build/macos/Build/Products/Release/Didacta.app \
            "${{ needs.comprobar.outputs.version }}" \
            dist

      - name: notarizar
        if: runner.os == 'macOS'
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          for file in dist/*.dmg dist/*.zip; do
            [ -f "$file" ] || continue
            packaging/macos/notarize.sh "$file"
          done

      # ------------------------------------------------------- Windows ----
      - name: compilar para Windows
        if: runner.os == 'Windows'
        working-directory: app
        run: flutter build windows --release

      - name: firmar el ejecutable
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # Se firma el ejecutable **antes** de meterlo en el instalador, y el
          # instalador después: si solo se firmara el instalador, SmartScreen
          # avisaría igual al ejecutar el programa.
          $pfx = Join-Path $env:RUNNER_TEMP 'didacta.pfx'
          [IO.File]::WriteAllBytes($pfx,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          & signtool sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            app\build\windows\x64\runner\Release\didacta.exe
          Remove-Item $pfx

      - name: el instalador
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Buscarlo en vez de dar por hecho dónde está: la imagen del runner
          # trae Inno Setup, pero ni la ruta ni la versión son un contrato, y
          # una ruta escrita a mano es la forma de que una publicación falle
          # el día que cambien la imagen.
          $iscc = Get-ChildItem -Path `
            "${env:ProgramFiles(x86)}\Inno Setup 6", `
            "${env:ProgramFiles}\Inno Setup 6" `
            -Filter ISCC.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $iscc) {
            Write-Host "Inno Setup no está en la imagen; instalándolo."
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem -Path `
              "${env:ProgramFiles(x86)}\Inno Setup 6", `
              "${env:ProgramFiles}\Inno Setup 6" `
              -Filter ISCC.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw "no encuentro ISCC.exe" }
          Write-Host "usando $iscc"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc `
            "/DDidactaVersion=${{ needs.comprobar.outputs.version }}" `
            "/DDidactaSource=$(Resolve-Path app\build\windows\x64\runner\Release)" `
            "/DDidactaIcon=$(Resolve-Path app\windows\runner\resources\app_icon.ico)" `
            "/DDidactaOutput=$(Resolve-Path dist)" `
            packaging\windows\didacta.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló con $LASTEXITCODE" }

      - name: firmar el instalador
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'didacta.pfx'
          [IO.File]::WriteAllBytes($pfx,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Get-ChildItem dist\*.exe | ForEach-Object {
            & signtool sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
          Remove-Item $pfx

      # --------------------------------------------------------- Linux ----
      - name: lo que Flutter necesita en Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev libjsoncpp-dev file desktop-file-utils

      - name: compilar para Linux
        if: runner.os == 'Linux'
        working-directory: app
        run: flutter build linux --release

      - name: el AppImage
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/linux/package.sh
          packaging/linux/package.sh \
            app/build/linux/x64/release/bundle \
            "${{ needs.comprobar.outputs.version }}" \
            dist

      # ----------------------------------------------------- los tres ----
      - name: los SHA-256
        shell: bash
        run: python3 packaging/release.py checksums dist

      - name: guardar los artefactos
        uses: actions/upload-artifact@v7
        with:
          name: didacta-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  publicar:
    name: publicar el release
    needs: [comprobar, construir]
    # `success()` sobre la matriz entera: si a un sistema le falló la
    # compilación, aquí no se llega. No hay release incompleto.
    if: ${{ !inputs.dry_run && needs.construir.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # para el tag y para la versión nueva
    steps:
      - uses: actions/checkout@v7
        with:
          # La historia entera, y no la descarga superficial de siempre: este
          # es el único trabajo que escribe en la rama, y ponerse detrás de un
          # commit que haya llegado mientras se compilaba necesita tenerla.
          fetch-depth: 0

      - name: el número de esta versión
        # El mismo que calcularon los otros tres, y por una razón que conviene
        # dejar dicha: los cuatro trabajos descargan **el mismo commit** --el
        # que disparó el workflow-- y aplican la misma función determinista.
        #
        # Hace falta aquí porque `notes` y `manifest` leen la versión de
        # `pubspec.yaml`, y porque este es el cambio que se deja escrito al
        # final.
        run: python3 packaging/release.py bump

      - name: recoger los tres
        uses: actions/download-artifact@v8
        with:
          path: descargas
          merge-multiple: true

      - name: ver qué hay
        run: |
          mkdir -p dist
          find descargas -type f -exec cp {} dist/ \;
          ls -lh dist

      - name: que estén los tres sistemas
        # La comprobación que impide publicar media versión: si falta el
        # AppImage, alguien en Linux se queda sin nada y sin enterarse.
        run: |
          # `find` y no `ls dist/$patron`: que una variable con un comodín se
          # expanda o no depende del shell --bash sí, zsh no-- y una
          # comprobación que sólo funciona en uno de los dos no es una
          # comprobación. Esto se ejecuta igual en cualquiera.
          missing=""
          for pattern in "*-macos-universal.dmg" "*-macos-universal.zip" \
                         "*-windows-x64.exe" "*-linux-x64.AppImage"; do
            found=$(find dist -maxdepth 1 -name "$pattern" -type f | head -1)
            [ -n "$found" ] || missing="$missing $pattern"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltan artefactos:$missing. No se publica un release incompleto."
            exit 1
          fi
          echo "· Los cuatro artefactos están."

      - name: los SHA-256, juntos
        run: python3 packaging/release.py checksums dist --out dist/SHA256SUMS.txt

      - name: el release, en borrador
        # En borrador **a propósito**. Mientras se suben 200 MB de binarios,
        # `releases/latest` no puede devolver un release al que todavía le
        # faltan ficheros. Se publica al final, en un solo acto.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.comprobar.outputs.tag }}
          VERSION: ${{ needs.comprobar.outputs.version }}
        run: |
          # Las notas se vuelven a leer del CHANGELOG en vez de venir
          # interpoladas desde el trabajo anterior.
          #
          # Una interpolación de Actions dentro de un `run:` mete el texto
          # **en el guion** antes de que exista ningún shell, así que una
          # comilla en una nota de versión rompería la orden y un `$(…)` se
          # ejecutaría. Es contenido del repositorio y no de un desconocido,
          # pero no hay ninguna razón para dejar esa puerta abierta: el
          # repositorio ya está aquí, y leerlo otra vez cuesta nada.
          #
          # Y este comentario no la escribe literal, porque Actions también
          # interpola dentro de los comentarios del shell: la primera versión
          # de esta explicación llevaba las llaves vacías y tumbaba el
          # workflow entero con «An expression was expected».
          python3 packaging/release.py notes > notas.md
          gh release create "$TAG" \
            -R "$RELEASE_REPO" \
            --title "Didacta $VERSION" \
            --notes-file notas.md \
            --draft \
            --target "$GITHUB_SHA"
          gh release upload "$TAG" -R "$RELEASE_REPO" dist/*

      - name: el manifiesto
        # Se genera **después** de subir, porque necesita el identificador que
        # GitHub le asigna a cada asset: es lo que permite descargarlo con un
        # `Authorization:` en lugar de con una URL pública, que es lo único
        # compatible con que el repositorio sea privado.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.comprobar.outputs.tag }}
        run: |
          # Dos cosas que hay que hacer justo así, y las dos se descubrieron
          # probándolo:
          #
          # `gh api` y no `gh release view --json assets`, porque este
          # devuelve el identificador de GraphQL (`RA_kwDO…`) y la API de
          # descarga pide el numérico.
          #
          # Y la lista de releases y no `releases/tags/$TAG`, porque **un
          # borrador todavía no tiene tag**: el tag de git se crea al
          # publicarlo. Por tag, esto daría 404 siempre.
          gh api "repos/$RELEASE_REPO/releases" --paginate \
            --jq "[.[] | select(.tag_name==\"$TAG\")] | first | .assets" \
            > assets.json
          test -s assets.json
          python3 packaging/release.py manifest dist \
            --assets assets.json --out latest.json
          cat latest.json
          gh release upload "$TAG" -R "$RELEASE_REPO" latest.json

      - name: publicarlo
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.comprobar.outputs.tag }}
        run: |
          gh release edit "$TAG" -R "$RELEASE_REPO" --draft=false --latest
          echo "· Publicado: https://github.com/$RELEASE_REPO/releases/tag/$TAG"

      # La página de descarga no se escribe aquí.
      #
      # La escribe `site.py` al construir la web, leyendo el release que
      # acaba de quedar publicado, y el despliegue lo dispara este workflow al
      # terminar (`workflow_run` en `site.yml`). Así la web dice lo que hay
      # publicado de verdad y no lo que un paso de aquí dejó escrito: si
      # alguien marca otra versión como la última --un rollback-- basta con
      # volver a desplegar, sin publicar nada.

      - name: la versión nueva, en el repositorio de código
        # El número se deja escrito **aquí**, no al empezar. Si algo se
        # rompiera antes, `main` se queda como estaba y el siguiente intento
        # vuelve a calcular el mismo número en vez de saltárselo. Un ensayo,
        # por lo mismo, no gasta ninguno.
        #
        # El tag no se crea aquí: lo crea GitHub al publicar el release, sobre
        # el commit que se le dio como `--target`, que es `$GITHUB_SHA` --el
        # que descargaron y compilaron los cuatro trabajos--. Crearlo también
        # aquí era lo que hacía antes, cuando las versiones vivían en otro
        # repositorio y el tag de éste estaba libre; con el release en el
        # mismo repositorio, el `git push` del tag chocaba con el que GitHub
        # acababa de crear y marcaba como fallida una publicación que había
        # salido bien. Pasó con la 0.1.0.
        #
        # Y el tag en el commit compilado es el sitio correcto: volver a esa
        # versión es sacar ese commit y ejecutar `release.py bump`, que es lo
        # que hizo cada trabajo, y da exactamente lo que se repartió.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.comprobar.outputs.tag }}
          VERSION: ${{ needs.comprobar.outputs.version }}
          RAMA: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/pubspec.yaml
          git commit -m "Didacta $VERSION"

          # Un reintento y no un `--force`: si alguien ha empujado a la rama
          # mientras se compilaba, lo que hay que hacer es ponerse detrás.
          # Este commit toca una línea de un fichero que no toca nadie más,
          # así que el rebase no tiene con qué chocar.
          if ! git push origin "HEAD:$RAMA"; then
            git fetch origin "$RAMA"
            git rebase "origin/$RAMA"
            if ! git push origin "HEAD:$RAMA"; then
              echo "::error::Didacta $VERSION está publicada, pero no he podido escribir la versión en $RAMA. Súbela a mano en app/pubspec.yaml antes de volver a publicar, o la próxima publicación repetirá el número."
              exit 1
            fi
          fi

      - name: el resumen
        run: |
          {
            echo "## Didacta ${{ needs.comprobar.outputs.version }} publicada"
            echo
            echo "https://github.com/$RELEASE_REPO/releases/tag/${{ needs.comprobar.outputs.tag }}"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  ensayo:
    name: ensayo (no se publica nada)
    needs: [comprobar, construir]
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: qué habría pasado
        run: |
          echo "## Ensayo de la ${{ needs.comprobar.outputs.version }}" \
            >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "El número no se ha gastado: se escribe al publicar, y un" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "ensayo no publica. La próxima publicación será esta misma." \
            >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.construir.result }}" = "success" ]; then
            echo "Los tres sistemas compilaron. Se habría publicado." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Alguna compilación falló.** No se habría publicado." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
